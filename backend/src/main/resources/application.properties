spring.application.name=viaja-api
server.port=${PORT:8080}

# Lê backend/.env (formato chave=valor) quando existir. O arquivo fica fora do Git.
spring.config.import=optional:file:.env[.properties]

# ---------- Banco de dados ----------
# H2 em memória, embutido na API: não precisa instalar nem configurar nada.
# Os dados vivem enquanto a API está no ar; a cada início a base de demonstração é recriada.
spring.datasource.url=jdbc:h2:mem:viaja;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ---------- Web ----------
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
spring.mvc.format.time=iso
server.error.include-message=never

# ---------- Segurança ----------
# JWT_SECRET com 32+ caracteres. Em branco, a API gera uma chave aleatória a cada início.
viaja.jwt.secret=${JWT_SECRET:}
viaja.jwt.expiracao-horas=24
viaja.cors.origens=${CORS_ORIGINS:http://localhost:5173}
viaja.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- Assistente de IA (RF-09) ----------
# A chave fica só no back-end (RNF-05). Em branco, o assistente usa o roteiro padrão.
# Serviço de IA: API Gemini, do Google. Os modelos são tentados em ordem: se o primeiro estiver
# sobrecarregado ou lento, a chamada passa para o seguinte, sempre dentro do tempo limite total.
viaja.ia.api-key=${GEMINI_API_KEY:}
viaja.ia.modelos=${IA_MODELOS:gemini-3.5-flash-lite,gemini-2.5-flash,gemini-3.1-flash-lite}
viaja.ia.url-base=${IA_URL_BASE:https://generativelanguage.googleapis.com/v1beta}
viaja.ia.timeout-segundos=15
viaja.ia.limite-diario=5

# ---------- E-mail (RF-14) ----------
# Para envio real, defina spring.mail.host, spring.mail.port, spring.mail.username e
# spring.mail.password no .env. Sem isso, os e-mails são apenas registrados no log.
viaja.email.remetente=${MAIL_FROM:nao-responda@viaja.local}

# ---------- Base de demonstração ----------
viaja.seed.ativo=${SEED_ATIVO:true}
viaja.seed.senha=${SEED_SENHA:viaja123}
